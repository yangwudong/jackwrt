# 构建参数（scripts/build.sh 读取）
IMMORTALWRT_VERSION=25.12.2
TARGET=x86/64
PROFILE=generic
# ImageBuilder 的 sha256，固定在这里：用镜像站时不依赖镜像站提供的 sha256sums
# 升级版本时更新：curl -s https://downloads.immortalwrt.org/releases/<版本>/targets/x86/64/sha256sums | grep imagebuilder
IMAGEBUILDER_SHA256=b9b290f5ef60a22bccd5bdca9c1e7523b8fc84e60462afbf550e20db94acf2c6

# 下载源。留空 = 官方站 https://downloads.immortalwrt.org
# 官方站挂了就换镜像（路径结构和官方站相同），例如：
#   https://mirrors.cernet.edu.cn/immortalwrt
#   https://mirror.nju.edu.cn/immortalwrt
#   https://mirrors.ustc.edu.cn/immortalwrt
#   https://mirrors.vsean.net/openwrt
# Actions 里也可以在运行时填 mirror 输入，不用改这里。
MIRROR=
# 固定不变：分区表一致，sysupgrade 才会只覆盖 p1/p2、保留 sda3
ROOTFS_PARTSIZE=8192

# 首次启动的 LAN 地址 / 主机名缺省值，只在数据分区上还没有 jwrt-lan.conf 时才用（新盘第一次装机）。
# 平时刷机，首次启动会读数据分区上 jwrt-backup 写的 jwrt-lan.conf，镜像里不需要这些值。
# 留空 = ImmortalWrt 默认（192.168.1.1 / ImmortalWrt）。写进镜像的值，任何下载 Release 的人都能看到，
# 所以这里保持留空；要用就写在 build.local.conf（gitignore）里，本地构建。
JWRT_LAN_IPADDR=
JWRT_LAN_NETMASK=255.255.255.0
JWRT_HOSTNAME=
